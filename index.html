<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="세경고등학교 인공지능반도체과 크로마토그래피 온라인 실험실 — 종이·TLC · 액체(HPLC) · 기체(GC), 기초 이론 · 실험 장치 · 가상 실험">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>크로마토그래피 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#15201E; --muted:#56655F; --line:#D3DCD9;
  --accent:#D3121A; --accent-ink:#FFFFFF; --accent-soft:#FDE4E4; --gold:#FFB414; --sred:#FC1820; --glass:#2A7584; --glass-soft:#DDEFF2;
  --ok:#1D7F46; --ok-soft:#DDF2E5; --warn:#A96A00; --warn-soft:#FBEFD6; --bad:#B8322A; --bad-soft:#F9E0DE;
  --lcd:#0F2A26; --lcd-ink:#9CF2D6; --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.06);
  --liquid:#8E1C74; --water:#CFE8F0;
  --r:12px;
  --fd:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --fb:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#FF5F64; --accent-ink:#1E0506; --accent-soft:#3E1517; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --surface:#16201E; --surface2:#1B2724; --ink:#E4EDEA; --muted:#94A6A1; --line:#2B3A37;
  --accent:#FF5F64; --accent-ink:#1E0506; --accent-soft:#3E1517; --glass:#6CC6D6; --glass-soft:#16353B;
  --ok:#5CCB8A; --ok-soft:#173424; --warn:#E9B04A; --warn-soft:#3A2C10; --bad:#F07C72; --bad-soft:#3D1A17;
  --lcd:#071614; --lcd-ink:#8FF0D0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --liquid:#C0349E; --water:#2B4A55;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,56px)} h2{font-size:clamp(26px,4vw,34px)} h3{font-size:21px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--glass)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.glass{background:var(--glass);border-color:var(--glass);color:var(--surface)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{border-left:3px solid var(--glass);padding:8px 12px;background:var(--glass-soft);border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
main{padding-top:24px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:24px 8px}
.school{font-family:var(--fd);font-size:clamp(28px,4.6vw,42px);line-height:1.15;color:var(--ink);display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline}
.school span{color:var(--accent)}
.gate{display:flex;flex-direction:column;gap:10px;text-align:left;border-radius:18px;padding:24px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:190px}
.gate:hover{transform:translateY(-3px)}
.gate.stu:hover{border-color:var(--accent)}.gate.tch:hover{border-color:var(--glass)}
.gate .gtag{font-family:var(--fm);font-size:12px;letter-spacing:.14em;color:var(--muted)}
.gate .gname{font-family:var(--fd);font-size:34px;line-height:1}
.gate.stu .gname{color:var(--accent)}.gate.tch .gname{color:var(--glass)}
.gate .gdesc{color:var(--muted);font-size:14.5px}
.gate .gcta{margin-top:auto;font-weight:700}
.hero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin-top:12px}
.door{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.units{margin-top:28px}
.unit{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.unit .num{font-family:var(--fm);font-size:13px;color:var(--muted);min-width:34px;padding-top:3px}
.unit.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit.off{opacity:.62;cursor:default}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* hub */
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .tag{font-family:var(--fm);font-size:12px;color:var(--accent)}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.mode svg{width:100%;height:120px}

/* quiz */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lv{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lv:hover{border-color:var(--c)}
.lv .badge{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-size:22px;color:#fff;background:var(--c)}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hearts{display:flex;gap:4px}
.heart{width:22px;height:20px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{margin-top:14px}
.qtype{display:inline-block;font-family:var(--fd);font-size:17px;padding:3px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:19px;font-weight:600;margin-top:10px}
.cho{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.cho span{font-family:var(--fd);font-size:40px;width:64px;height:72px;display:grid;place-items:center;background:var(--lcd);color:var(--lcd-ink);border-radius:10px}
.cho span.sp{background:transparent;width:18px}
.jam{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.syl{width:66px;height:78px;border-radius:10px;border:2px dashed var(--glass);display:grid;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;padding:6px;font-family:var(--fd);font-size:24px;color:var(--glass);background:var(--glass-soft)}
.syl .c{grid-column:1;grid-row:1;display:grid;place-items:center}
.syl .v{grid-column:2;grid-row:1;display:grid;place-items:center;color:var(--muted);font-size:18px}
.syl .j{grid-column:1/3;grid-row:2;display:grid;place-items:center}
.syl.sp{border:0;background:none;width:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ox{display:flex;gap:14px;margin-top:18px}
.ox button{flex:1;font-family:var(--fd);font-size:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:10px}
.ox button:hover{border-color:var(--accent)}
.ansrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:180px;font-size:18px}
.blankq{font-size:19px;line-height:2}
.blankq .b{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mi.shake{animation:shake .35s}
.orderlist{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.oi{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.oi .n{font-family:var(--fm);color:var(--muted);width:22px}
.oi .t{flex:1}
.oi button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;width:34px;height:30px}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px}
.feedback.ok{background:var(--ok-soft);color:var(--ink);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.feedback b{font-family:var(--fd);font-size:20px;font-weight:400}
.combo{font-family:var(--fd);color:var(--accent);font-size:20px}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--warn)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
.pt{outline:none}.pt .tip{opacity:0;transition:opacity .12s;pointer-events:none}.pt:hover .tip,.pt:focus .tip{opacity:1}.pt:hover circle:nth-child(2),.pt:focus circle:nth-child(2){stroke:var(--ink);stroke-width:2}
.rank{font-family:var(--fd);font-size:88px;line-height:1;color:var(--accent)}

/* practice */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:18px}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .ck{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.tool svg{width:70px;height:80px}
.tool.sel{border-color:var(--accent);background:var(--accent-soft)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.bench.wide{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.bench.wider{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.bench,.bench.wide,.bench.wider{grid-template-columns:1fr}.zoom{transform:scale(.8);transform-origin:top left}}
.stage{background:linear-gradient(var(--surface2),var(--surface2)) padding-box;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:center;align-items:flex-end;gap:20px;padding:14px;min-height:280px;position:relative;flex-wrap:wrap}
.stage svg{max-width:100%}
.holdbtn{user-select:none;-webkit-user-select:none;touch-action:none}
.holdbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoom{width:150px;height:150px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:var(--surface)}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.stp{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:14px}
.stp::before{counter-increment:s;content:counter(s);font-family:var(--fm);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none}
.stp.done{color:var(--muted)} .stp.done::before{background:var(--ok);color:#fff;content:"✓"}
.stp.cur{background:var(--accent-soft)} .stp.cur::before{background:var(--accent);color:#fff}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip.used{opacity:.35;pointer-events:none}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{min-width:110px;min-height:44px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:6px 10px;font-weight:600;font-size:14px;text-align:center}
.slot.fill{border-style:solid;border-color:var(--glass);background:var(--glass-soft)}
.arrow{color:var(--muted);font-family:var(--fm)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--fm);font-size:11px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.table th{background:var(--surface2);font-weight:600}
.tw{overflow-x:auto}

/* instrument */
.inst{background:#D9DEDC;border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;border:1px solid #BFC6C3;color:#15201E}
:root[data-theme="dark"] .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inst{background:#2A3331;border-color:#3A4643;color:#E4EDEA}}
@media (max-width:760px){.inst{grid-template-columns:1fr}}
.screen{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:12px;min-height:250px;font-family:var(--fm);font-size:13px;position:relative;overflow:hidden}
.screen .big{font-size:30px;font-weight:600}
.screen button{background:rgba(156,242,214,.1);border:1px solid rgba(156,242,214,.4);color:var(--lcd-ink);border-radius:6px;padding:6px 10px;font-family:var(--fm);font-size:12.5px}
.screen button:hover{background:rgba(156,242,214,.22)}
.screen input,.screen select{background:#0a1f1c;color:var(--lcd-ink);border-color:rgba(156,242,214,.35);font-family:var(--fm);padding:4px 8px;font-size:13px}
.screen .off{position:absolute;inset:0;background:#050b0a;display:grid;place-items:center;color:#3c5a54}
.screen table{width:100%;border-collapse:collapse}
.screen td,.screen th{border-bottom:1px solid rgba(156,242,214,.18);padding:3px 4px;text-align:right}
.screen th{text-align:right;font-weight:600;opacity:.7}
.holder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos{background:#11191A;border-radius:8px;padding:6px;color:#cfe;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--fm);font-size:11px;min-height:86px;border:2px solid transparent}
.pos.sel{border-color:var(--accent)}
.pos .cv{width:22px;height:40px;border:1.5px solid #9ab;border-radius:2px;position:relative;background:#1d2b2d}
.pos .cv i{position:absolute;left:0;right:0;bottom:0;height:78%}
.power{width:44px;height:44px;border-radius:50%;border:2px solid #6a7571;background:#2B3432;color:#fff;font-weight:700}
.power.on{background:var(--ok);border-color:var(--ok)}

/* exam */
.examgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.examgrid{grid-template-columns:1fr}}
.stepper{position:sticky;top:70px;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.stepper{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sb{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}
.sb .d{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--fm);font-size:11px;flex:none}
.sb.done .d{background:var(--ok);color:#fff}
.sb.cur{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.sb.cur .d{background:var(--accent);color:#fff}
.sb:disabled{opacity:.5;cursor:not-allowed}
.stamp{display:inline-grid;place-items:center;width:42px;height:42px;border:2px solid var(--bad);color:var(--bad);border-radius:50%;font-family:var(--fd);font-size:14px;transform:rotate(-12deg);animation:pop .3s}
.sheet{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:18px}
.sheet h3{text-align:center;margin-bottom:10px}
.graphbox{background:#FFFDF7;border:1px solid #E4D9BF;border-radius:6px;overflow:hidden;touch-action:none}
:root[data-theme="dark"] .graphbox{background:#1C1A14;border-color:#3A3527}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .graphbox{background:#1C1A14;border-color:#3A3527}}
.score{font-family:var(--fd);font-size:72px;color:var(--accent);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}
.modalbg{position:fixed;inset:0;background:rgba(10,16,15,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 첫 화면 */
#gate{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;color:#333;transition:opacity .6s ease}
#gate.gone{opacity:0;pointer-events:none}
.gplaque img{display:block;height:clamp(38px,6vw,52px);width:auto}
.gdept{font-family:var(--fd);font-size:clamp(20px,3.4vw,28px);color:#333;letter-spacing:.04em}
.gtitle{font-family:var(--fd);font-size:clamp(46px,9vw,84px);line-height:1;color:#FC1820;letter-spacing:.02em}
.gsub{font-size:clamp(14px,2.2vw,17px);color:#646363}
.gscene{width:min(560px,88vw);max-height:48vh;display:grid;place-items:center;cursor:pointer;transition:transform 1s cubic-bezier(.6,.05,.3,1)}
.gscene img{max-width:100%;max-height:48vh;height:auto;object-fit:contain;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#gate.open .gscene{transform:scale(1.8)}
#gate.open .gtop,#gate.open .gbtn,#gate.open .gnote{opacity:0;transition:opacity .35s}
.gtop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gbtn{font-family:var(--fd);font-size:22px;padding:12px 34px;border-radius:999px;border:2px solid #FFB414;background:#FC1820;color:#fff;box-shadow:0 8px 22px rgba(252,24,32,.3);animation:pulse 2s infinite}
.gbtn:hover{background:#E0141B}
@keyframes pulse{50%{box-shadow:0 8px 34px rgba(252,24,32,.5)}}
.gnote{font-size:12.5px;color:#969696}
@media (prefers-reduced-motion:reduce){.gscene img{animation:none}.gscene{transition:none}}
</style>

<main class="wrap" id="app"></main>
<div id="toastbox"></div>
<style>
.ns{vector-effect:non-scaling-stroke}
.exp{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:20px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;position:relative}
.exp:hover{transform:translateY(-3px);border-color:var(--accent)}
.exp.lock{cursor:default;opacity:.72}.exp.lock:hover{transform:none;border-color:var(--line)}
.exp .code{font-family:var(--fm);font-size:12px;color:var(--accent);letter-spacing:.1em}
.exp svg{width:100%;height:110px}
.concept{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.concept .panel h4{margin:0 0 6px;font-family:var(--fd);font-weight:400;font-size:19px}
.concept .panel p,.concept .panel li{font-size:14px}
.concept .panel ul{margin:0;padding-left:18px}
.formula{font-family:var(--fm);background:var(--lcd);color:var(--lcd-ink);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}
details.sum{margin-top:18px}
details.sum>summary{cursor:pointer;font-family:var(--fd);font-size:21px;list-style:none;display:flex;align-items:center;gap:8px}
details.sum>summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.sum[open]>summary::before{transform:rotate(90deg)}
.lane{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px}
.lane.sel{border-color:var(--accent);background:var(--accent-soft)}
.lane .dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.ck{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
.ck.on{border-color:var(--ok);background:var(--ok-soft)}
.meter{font-family:var(--fm);font-size:13px}
.inp{width:96px;text-align:right;font-family:var(--fm)}
.scene{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;justify-content:center}
.scene svg{width:100%;max-width:380px;height:auto}
.opicwrap{display:flex;flex-direction:column}#opic{position:relative;flex:1;min-height:520px;padding:0}#opic svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);max-width:none}#ocap{font-size:16px;line-height:1.6}
.mview svg{width:100%;max-width:420px;height:auto;cursor:crosshair;touch-action:none}
.zview{background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.zview svg{display:block;width:100%;height:auto}
.soon{position:absolute;top:14px;right:14px}
.oi{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:box-shadow .15s}.oi .grip{color:var(--muted);font-size:18px;line-height:1}.oi.drag{cursor:grabbing;border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.tpic{position:relative;display:grid;place-items:center}.tpic img{display:none}.tpic.has svg{display:none}.tpic.has img{display:block;object-fit:contain;border-radius:8px;background:#fff}.tool .tpic.has img{width:80px;height:80px}.toolbig .tpic.has img{width:140px;height:150px}
.toolbig{min-width:150px;min-height:160px;padding:6px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:14px;flex:none}.toolbig svg{width:130px;height:150px}
.igwarn{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(120,6,10,.82);backdrop-filter:blur(3px);animation:igin .2s}
.igwarn.calm{background:rgba(20,24,32,.72)}
@keyframes igin{from{opacity:0}to{opacity:1}}
.igbox{background:#fff;color:#1b1f27;border-radius:16px;max-width:480px;width:100%;padding:24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.igbox h3{margin:10px 0 6px;font-size:20px}.igbox p{margin:6px 0;line-height:1.6}
.igicon{width:58px;height:58px;margin:0 auto;border-radius:50%;background:#D3121A;color:#fff;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center}
.igicon.ok{background:#2A7584;font-size:26px}
.iglog{margin:10px 0 14px;padding:8px 10px;border-radius:8px;background:#fdecec;color:#9b0e14;font-size:13px}
.igbox button[disabled]{opacity:.55;cursor:not-allowed}

function sortableList(el,arr,redraw){
  el.innerHTML=arr.map((t,i)=>`<div class="oi" data-i="${i}" tabindex="0" aria-label="${i+1}번째: ${esc(t)}. 끌거나 위아래 화살표로 이동"><span class="grip" aria-hidden="true">⠿</span><span class="n">${i+1}</span><span class="t">${esc(t)}</span></div>`).join('');
  let drag=null;
  $$('.oi',el).forEach(it=>{
    it.addEventListener('pointerdown',e=>{e.preventDefault();drag=+it.dataset.i;it.classList.add('drag');el.setPointerCapture&&el.setPointerCapture(e.pointerId)});
    it.addEventListener('keydown',e=>{const i=+it.dataset.i;const d=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;if(!d)return;e.preventDefault();const k=i+d;if(k<0||k>=arr.length)return;[arr[i],arr[k]]=[arr[k],arr[i]];redraw();$(`.oi[data-i="${k}"]`,el)?.focus()});
  });
  el.onpointermove=e=>{if(drag==null)return;const items=$$('.oi',el);let k=items.length-1;for(let j=0;j<items.length;j++){const r=items[j].getBoundingClientRect();if(e.clientY<r.top+r.height/2){k=j;break}}
    if(k!==drag){const [m]=arr.splice(drag,1);arr.splice(k,0,m);drag=k;el.innerHTML='';redraw(k)}};
  el.onpointerup=el.onpointercancel=()=>{if(drag==null)return;drag=null;$$('.oi',el).forEach(x=>x.classList.remove('drag'))};
  return {setDrag(k){drag=k;const it=$(`.oi[data-i="${k}"]`,el);if(it)it.classList.add('drag')}};
}

/* 종이 내용 그리기 (단위: cm, y는 아래로) — ox: 종이 왼쪽, by: 종이 아래 끝 */
function paperInner(st,ox,by){
  const Y=h=>by-h;const W=PW;let s='';const tlc=st.phase==='tlc';
  s+=`<rect x="${ox}" y="${by-PH}" width="${W}" height="${PH}" fill="${tlc?'#ECEFF3':'#FCFCF7'}" stroke="${tlc?'#7D8894':'#9AA5A1'}" stroke-width="${tlc?1.6:1}" class="ns"/>`;
  const frontAt=x=>st.front+(st.tilt||0)*((x/W)-.5)*2;
  if(st.wet&&st.front!=null){const pts=[];for(let i=0;i<=16;i++){const x=W*i/16;pts.push(`${ox+x},${Y(frontAt(x))}`)}
    s+=`<polygon points="${ox},${by} ${pts.join(' ')} ${ox+W},${by}" fill="#BFDFF0" opacity=".55"/>`}
  // 기준선
  if(st.pen){const bl=st.pen==='ballpen';
    s+=`<line x1="${ox+.15}" x2="${ox+W-.15}" y1="${Y(st.base)}" y2="${Y(st.base)}" stroke="${bl?'#2440B8':'#5B5F63'}" stroke-width="${bl?1.6:1.1}" class="ns"/>`;
    if(bl&&st.front!=null&&st.front>st.base){const up=Math.min(1.6,(st.front-st.base)*.35);
      s+=`<rect x="${ox+.15}" y="${Y(st.base+up)}" width="${W-.3}" height="${up}" fill="#3550C8" opacity=".18"/>`}
    if(st.base>=.8)LANES.forEach(l=>{s+=`<text x="${ox+l.x}" y="${Y(st.base-.5)}" font-size=".38" text-anchor="middle" fill="${bl?'#2440B8':'#6A6E72'}" font-family="IBM Plex Mono,monospace">${l.lab}</text>`})}
  // 시료 점
  (st.spots||[]).forEach((sp,i)=>{if(!sp)return;const lx=ox+LANES[i].x;const r0=sp.d/20*1.35;
    const dev=st.front!=null&&st.front>st.base&&!st.washed;
    if(st.washed){s+=`<circle cx="${lx}" cy="${Y(st.base)}" r="${r0}" fill="${sp.color}" opacity=".08"/>`;return}
    if(!dev){s+=`<circle cx="${lx}" cy="${Y(st.base)}" r="${r0}" fill="${sp.color}" opacity="${sp.a}"/>`;return}
    const fe=(st.Feff!=null?st.Feff:st.front)+((st.tilt||0)*((LANES[i].x/W)-.5)*2);

  if(st.length<need){seen=[];st=st.concat(pickFrom(QB[l].filter(q=>!st.includes(q))).slice(0,need-st.length))}
  seen=seen.concat(st.map(q=>q.id));store.set(key,seen);
  return shuffle(st);
}

    ${q.t==='blank'?'':`<p class="qtext">${esc(q.q)}</p>`}${L.timer?`<div class="timer"><i id="tbar" style="width:100%"></i></div>`:''}${body}
    <div class="row" style="margin-top:14px;justify-content:space-between">${['cho','jaeum','calc'].includes(q.t)?`<button class="btn sm" id="hintbtn">힌트 보기 (−40)</button>`:'<span></span>'}<button class="btn sm" id="quit">그만하기</button></div>
    <div id="fb"></div></div>`;
  $('#quit').onclick=()=>endQuiz();

  if(['cho','jaeum','calc'].includes(q.t)){const inp=$('#ans');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')checkInput()};$('#submit').onclick=checkInput}

function orderWidget(el,arr){const draw=k=>{const sl=sortableList(el,arr,draw);if(k!=null)sl.setDrag(k)};draw()}
function ansInput(){return `<div class="ansrow"><input id="ans" placeholder="정답을 입력하세요" autocomplete="off"><button class="btn pri" id="submit">제출</button></div>`}
function answerText(q){if(q.t==='cho'||q.t==='jaeum')return q.disp||q.word;if(q.t==='calc')return q.a+' '+(q.unit||'');if(q.opts)return q.opts[q.a];if(q.t==='ox')return q.a?'O':'X';if(q.items)return q.items.join(' → ');return ''}
function hintFor(q){if(q.t==='cho'||q.t==='jaeum'){const w=q.word;return `${w.length}글자, 첫 글자는 "${w[0]}"`}return 'Rf = 시료 이동 거리 ÷ 용매 이동 거리 (모두 기준선부터)'}
function checkInput(){
  if(Q.answered)return;const q=Q.qs[Q.i];const v=$('#ans').value.trim();if(!v){toast('답을 입력하세요');return}
  let ok;if(q.t==='calc'){const n=parseFloat(v.replace(/,/g,''));ok=!isNaN(n)&&Math.abs(n-q.a)<=q.tol}
  else{const alts=[q.word,q.disp||'',...(q.alt||[])].filter(Boolean);ok=alts.some(a=>norm(a)===norm(v))}
  judge(ok,answerText(q));
}
function judge(ok,ans){
  if(Q.answered)return;Q.answered=true;clearInterval(qTimer);const q=Q.qs[Q.i];
  if(ok){Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);Q.right++;const pts=100+(Q.combo>1?(Q.combo-1)*20:0)-(Q.hint?40:0);Q.score+=pts;
    $('#fb').innerHTML=`<div class="feedback ok pop"><b>정답! +${pts}</b><p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.i+1<Q.qs.length?'다음 문제 →':'결과 보기'}</button></div></div>`}
  else{Q.combo=0;Q.hearts--;Q.wrong.push({q,ans});
    $('#fb').innerHTML=`<div class="feedback bad pop"><b>아쉬워요</b>${ans?`<p style="margin-top:4px">정답: <b style="font-family:var(--fb);font-size:15px;font-weight:700">${esc(ans)}</b></p>`:''}<p style="margin-top:4px">${esc(q.exp)}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="next">${Q.hearts<=0||Q.i+1>=Q.qs.length?'결과 보기':'다음 문제 →'}</button></div></div>`;
    $$('.heart path')[Q.hearts]?.setAttribute('fill','var(--line)')}
  $('#qscore').textContent=Q.score+'점';
  const n=$('#next');n.focus();n.onclick=()=>{if(Q.hearts<=0||Q.i+1>=Q.qs.length)endQuiz();else{Q.i++;showQ()}};
}
function endQuiz(){
  clearInterval(qTimer);const total=Q.qs.length,rate=Q.right/total;
  const rank=Q.hearts<=0?'C':rate>=.9?'S':rate>=.75?'A':rate>=.55?'B':'C';
  const msg={S:'완벽해요! 다음 단계에 도전해 보세요.',A:'거의 다 왔어요. 오답노트만 한 번 보면 S랭크.',B:'개념의 뼈대는 잡혔어요. 오답노트를 꼭 확인하세요.',C:`괜찮아요. 교과서 ${Q.xp==='lc'?'201~205':Q.xp==='gc'?'205':'197~200'}쪽 정리를 보고 다시 도전!`}[rank];
  const bk='quizBest_'+Q.xp;const best=store.get(bk,{});if(best[Q.l]==null||Q.score>best[Q.l]){best[Q.l]=Q.score;store.set(bk,best)}
  const L=LEVELS[Q.l];
  const qsec=Math.round((Date.now()-(Q.t0||Date.now()))/1000);if(IG.on&&IG.ctx.startsWith('종이 기초 이론'))igStop();
  record(`${EXPS.find(e=>e.id===Q.xp).k}/기초 이론`,`${L.sub}`,Q.score,`${igText(Q.ig)}소요 ${Math.floor(qsec/60)}분 ${qsec%60}초 · 정답 ${Q.right}/${total} · ${rank}랭크 · 최대 콤보 ${Q.maxCombo}${Q.hearts<=0?' · 하트 소진':''}`,Math.round(TW[L.sub]*Q.right/total*10)/10);
  app.innerHTML=`<div class="card pop" style="text-align:center"><p class="eyebrow">기초 이론 · ${L.sub} 결과</p><div class="rank" style="margin-top:10px">${rank}</div><p style="margin-top:8px;font-size:17px">${msg}</p>
    <div class="row" style="justify-content:center;margin-top:14px"><span class="pill acc">점수 ${Q.score}</span><span class="pill ok">정답 ${Q.right}/${total}</span><span class="pill">최대 콤보 ${Q.maxCombo}</span>${Q.hearts<=0?'<span class="pill bad">하트 소진</span>':''}</div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn pri" id="again">다시 도전</button><button class="btn" data-go="${Q.xp}-theory">단계 선택</button>${Q.l<2?`<button class="btn" id="up">다음 단계 →</button>`:`<button class="btn" data-go="${Q.xp}-setup">실험 장치로 →</button>`}</div></div>
  ${Q.wrong.length?`<div class="card" style="margin-top:16px"><h3>오답노트</h3><div class="stack" style="margin-top:10px">${Q.wrong.map(w=>`<div class="panel"><span class="pill">${TYPE_NAME[w.q.t]}</span><p style="margin-top:6px;font-weight:600">${esc(w.q.q)}</p>${w.ans?`<p class="small" style="margin-top:4px">정답: <b>${esc(w.ans)}</b></p>`:''}<p class="small muted" style="margin-top:4px">${esc(w.q.exp)}</p></div>`).join('')}</div></div>`:''}`;
  $('#again').onclick=()=>startQuiz(Q.l);const up=$('#up');if(up)up.onclick=()=>startQuiz(Q.l+1);
}

const ORDER_STEP_NOTE=['종이를 알맞은 크기로 준비했어요. 거름종이가 고정상입니다.','기준선은 용매에 녹지 않는 연필로, 아래 끝에서 1.5 cm 위에 긋습니다.','시료 점은 작게 찍고 말리기를 반복해야 성분끼리 겹치지 않아요.','용매는 기준선보다 낮게! 뚜껑을 덮어 용기 안을 용매 증기로 포화시킵니다.','시료 점이 용매에 잠기지 않게 종이를 넣고 뚜껑을 덮습니다.','용매가 끝에 닿기 전에 꺼내 용매 전선을 연필로 표시합니다.','기준선에서 각 점(a)과 용매 전선(b)까지 거리를 잽니다.','Rf = a ÷ b 를 계산해 표준 물질과 비교하면 성분을 알 수 있어요.'];
function orderPrefix(arr){let n=0;while(n<arr.length&&arr[n]===ORDER_ITEMS[n])n++;return n}
function orderSceneSVG(n){
  const by=14.5,ox=1,bw=10,W=PW,base=1.5,level=.8,front=7.9;const Y=h=>by-h;
  let s=`<svg viewBox="-0.75 -0.55 18.1 15.75" role="img" aria-label="실험 순서에 따라 나타나는 크로마토그래피 장치 그림">`;
  if(n===0)return s+`<rect x="1" y="2.5" width="8" height="12" rx=".2" fill="none" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="5 4" class="ns"/><text x="5" y="8.2" font-size=".72" text-anchor="middle" fill="var(--muted)">첫 단계부터 맞게 배열하면</text><text x="5" y="9.3" font-size=".72" text-anchor="middle" fill="var(--muted)">장치가 하나씩 나타나요</text></svg>`;
  const cont=n>=4,inP=n<4||n>=5,dev=n>=6;
  if(cont)s+=`<rect x="0" y="${by-level}" width="${bw}" height="${level}" fill="#9CCFE6" opacity=".7"/>`;
  if(inP){
    const st={base,pen:n>=2?'pencil':null,front:dev?front:null,wet:dev,frontMark:dev,
      spots:n>=3?[0,1,2,3].map(i=>({d:2.6,a:.95,color:mixColor(i,UNKS[0]),comps:(i<3?[LANES[i].k]:UNKS[0].comp).map(k=>({k,rf:DYES[k].rf.paper.water}))})):[]};
    s+=paperInner(st,ox,by);
  }
  if(cont){
    if(n>=5){s+=`<rect x="-0.6" y="0.55" width="11.2" height=".32" rx=".16" fill="#CFE3E8" stroke="#7FA3AD" stroke-width="1" class="ns"/>`;
      s+=`<line x1="${ox+4}" x2="${ox+4}" y1=".85" y2="${by-PH}" stroke="#7A7F82" stroke-width="1.4" class="ns"/><rect x="${ox+3.5}" y="${by-PH-.35}" width="1" height=".6" rx=".1" fill="#5D6B70"/>`}
    s+=`<path d="M0 1 V${by} H${bw} V1" fill="none" stroke="var(--ink)" stroke-width="2" class="ns"/><path d="M-0.35 1 H0.2 M9.8 1 H10.35" stroke="var(--ink)" stroke-width="2" class="ns"/>`;
    s+=`<path d="M-0.6 0.5 Q5 -0.25 10.6 0.5" fill="rgba(200,230,240,.35)" stroke="var(--glass)" stroke-width="2" class="ns"/>`;
    if(n===4)s+=`<text x="5" y="7.6" font-size=".68" text-anchor="middle" fill="var(--glass)" font-weight="700">용매 증기로 포화 중…</text>`;
  }
  // 거리 측정 화살표 (a: 빨강 색소, b: 용매 전선)
  const ry=Y(base+DYES.R.rf.paper.water*(front-base));
  if(n>=7){const ar=(x,y1,y2,c)=>`<line x1="${x}" x2="${x}" y1="${y1}" y2="${y2}" stroke="${c}" stroke-width="1.4" class="ns"/><path d="M${x-.18} ${y2+.3} L${x} ${y2} L${x+.18} ${y2+.3}" fill="none" stroke="${c}" stroke-width="1.4" class="ns"/>`;
    s+=`<line x1="${ox+LANES[1].x+.4}" x2="9.3" y1="${ry}" y2="${ry}" stroke="#D3304A" stroke-width="1" stroke-dasharray="3 3" class="ns"/>`;
    s+=ar(9.3,Y(base),ry,'#D3304A')+ar(9.72,Y(base),Y(front),'var(--accent)');
    s+=`<text x="9.3" y="${(Y(base)+ry)/2}" font-size=".6" text-anchor="end" dx="-.15" fill="#D3304A" font-weight="800">a</text><text x="9.72" y="${(Y(base)+Y(front))/2-1}" font-size=".6" dx=".1" fill="var(--accent)" font-weight="700">b</text>`}
  // 이름표: [표시 시작 단계, 이름, 표 y, 가리킬 점 x, y]
  const L=[[4,'뚜껑',.3,6.5,.15],[1,'거름종이 (고정상)',2.1,ox+7.2,3.2],[6,'용매 전선',5.5,ox+W-.4,Y(front)],[7,'b : 용매 이동 거리',7.3,9.72,8.6],[7,'a : 시료 이동 거리',9.2,9.3,11.4],[3,'시료 점',10.9,ox+LANES[3].x+.35,Y(base)-.1],[2,'기준선 (연필)',12.1,ox+W-.4,Y(base)],[4,'전개 용기',13.3,10,13.2],[4,'전개 용매 (이동상)',14.5,9.6,by-level/2]];
  L.forEach(([k,t,ly,tx,ty])=>{if(n<k||(k===4&&!cont))return;const c=k===n?'var(--accent)':'var(--ink)';
    s+=`<polyline points="${tx},${ty} 10.6,${ly} 10.85,${ly}" fill="none" stroke="${c}" stroke-width="1.3" opacity=".8" class="ns"/><circle cx="${tx}" cy="${ty}" r=".14" fill="${c}"/>`;
    s+=`<text x="10.95" y="${ly+.24}" font-size=".68" fill="${c}" font-weight="${k===n?800:600}">${t}</text>`});
  if(n>=8)s+=`<rect x="10.85" y="3.1" width="6.3" height="1.35" rx=".22" fill="none" stroke="var(--accent)" stroke-width="1.8" class="ns"/><text x="14" y="4.04" font-size=".78" text-anchor="middle" fill="var(--accent)" font-weight="800">Rf = a ÷ b</text>`;
  return s+`</svg>`;
}
let OD=null;

    else $('#ofb').innerHTML=`<div class="note bad">${ORDER_ITEMS.length}개 중 ${right}개가 제자리에 있어요. 다시 생각해 보세요.</div>`};
}

 {k:'lid',st:{lid:false},a:'전개 용기의 뚜껑을 덮지 않았다',exp:'용기 안이 증기로 포화되지 않아 용매가 증발하고 용매 전선이 고르지 않게 됩니다.'},

    else{ER.tried=true;b.classList.add('wrong');toast('다시 찾아보세요')}});

let P=null;
function newLab(){
  const unk=pk(UNKS);const rf={};
  Object.keys(DYES).forEach(k=>{rf[k]={};Object.keys(PHASE).forEach(ph=>{rf[k][ph]={};Object.keys(SOLV).forEach(s=>rf[k][ph][s]=Math.max(.04,Math.min(.95,DYES[k].rf[ph][s]+gauss()*.015)))})});

     dev:{front:null,t:0,running:false,done:false,started:false,over:false,Feff:null,tilt:0,washed:false},guide:null,

function labState(o={}){
  const s={phase:P.phase,base:P.base,pen:P.pen,level:P.level,lid:P.lid,spots:P.spots.map((sp,i)=>{if(!sp||!sp.n)return null;
    const comps=(i<3?[LANES[i].k]:P.unk.comp).map(k=>({k,rf:P.solvent?P.rf[k][P.phase||'paper'][P.solvent]:0}));

   ${d.done&&d.over?'<div class="note warn" style="margin-top:12px">용매가 종이 끝까지 올라가 버렸어요. 실제 용매 이동 거리를 알 수 없어 Rf가 부정확해집니다.</div>':''}
   ${d.done?'<div class="note ok" style="margin-top:12px">종이를 꺼내 연필로 용매 전선을 표시하고 말렸어요. 이제 거리를 잴 차례!</div>':''}</div></div>${navRow(d.done&&!d.washed)}`;
  const tick=()=>{const K=(P.lid?2.2:1.85)*(P.phase==='tlc'?1.35:1);d.t+=.25;const h=P.level+K*Math.sqrt(d.t);
    if(h>=PH-.05){if(!d.over){d.over=true;toast('용매가 종이 끝에 닿았어요!')}d.front=PH-.05;d.Feff=h}else{d.front=h;d.Feff=h}
    $('#dscene').innerHTML=sceneSVG(labState());$('#tm').textContent=tt();
    if(d.Feff>14.5){clearInterval(devTimer);d.running=false;$('#dgo').textContent='▶ 계속';$('#dmsg').textContent='일시 정지 — 종이를 꺼내세요'}};

    if(d.running){d.running=false;clearInterval(devTimer);drawLab();return}
    if(!d.started){d.started=true;d.front=P.level;d.Feff=P.level;d.tilt=P.lid?0:(Math.random()<.5?-1:1)*rnd(.25,.45);
      if(P.level>=P.base-.05){d.washed=true;drawLab();return}
      if(!P.lid)toast('뚜껑이 없어 용매가 증발하고 있어요');}

  $('#dout').onclick=()=>{clearInterval(devTimer);d.running=false;d.done=true;goStep(4)};
  onStep(()=>{clearInterval(devTimer);if(d.running){d.running=false}});

/* 측정 */
function truth(){
  const d=P.dev;const eAt=x=>d.Feff+d.tilt*((x/PW)-.5)*2;
  const D=d.front-P.base;
  const pos=[0,1,2,3].map(i=>{const x=LANES[i].x;return (i<3?[LANES[i].k]:P.unk.comp).map(k=>({k,h:Math.min(PH-.15,P.base+P.rf[k][P.phase][P.solvent]*(eAt(x)-P.base))}))});
  return {D,dist:pos.map(a=>a.map(c=>({k:c.k,d:c.h-P.base})))};
}
function rulerSVG(){
  let s=`<rect x="-1.65" y="0" width="1.4" height="12" fill="#F5EBC8" stroke="#A8996A" stroke-width="1" class="ns"/>`;
  const max=Math.floor((PH-P.base)*10+1e-6);
  for(let m=0;m<=max;m++){const y=12-(P.base+m/10);const L=m%10===0?.55:m%5===0?.38:.22;
    s+=`<line x1="-0.25" x2="${-0.25-L}" y1="${y}" y2="${y}" stroke="#3A3A3A" stroke-width="${m%10===0?1.2:.8}" class="ns"/>`;
    if(m%10===0)s+=`<text x="-1.05" y="${y+.13}" font-size=".36" text-anchor="middle" fill="#3A3A3A" font-family="IBM Plex Mono,monospace">${m/10}</text>`}
  return s;
}

}

  const sf=Object.values(P.safety).filter(Boolean).length;sec.push(['준비 · 안전',Math.round(5*sf/4),5]);if(sf<4)notes.push('안전 점검을 모두 하지 않았어요. 에탄올은 인화성이라 화기 확인이 필요합니다.');

function lcGrade(smp){
  const A=LCS.ans,num=v=>parseFloat(String(v).replace(/,/g,''));const sec=[],notes=[];
  const sf=Object.values(LCS.safety).filter(Boolean).length;sec.push(['준비 · 안전',Math.round(5*sf/4),5]);if(sf<4)notes.push('안전 점검을 모두 하지 않았어요. 메탄올은 독성·인화성이 있어요.');
  // 이동상
  let mp=(LCS.grade==='hplc'?5:0)+(LCS.degas!=='none'?5:0);
  if(LCS.grade!=='hplc')notes.push('일반 시약 용매를 써서 유령 피크와 기준선 상승이 생겼어요. HPLC grade 용매를 사용하세요.');
  if(LCS.degas==='none')notes.push('이동상을 탈기하지 않아 압력이 흔들리고 기준선에 잡음이 생겼어요.');
  const c=smp.cond;const save={phi:LCS.phi,flow:LCS.flow,temp:LCS.temp};Object.assign(LCS,{phi:c.phi,flow:c.flow,temp:c.temp});
  const trs=CKEYS.map(k=>({k,tr:tROf(k),sg:tROf(k)/Math.sqrt(Npl())})).sort((a,b)=>a.tr-b.tr);Object.assign(LCS,save);
  const allIn=trs.every(x=>x.tr<RUNT-.1);let minRs=99;for(let i=1;i<trs.length;i++)minRs=Math.min(minRs,(trs[i].tr-trs[i-1].tr)/(2*(trs[i].sg+trs[i-1].sg)));
  const cs=allIn&&minRs>=1.5?5:allIn&&minRs>=1?3:0;mp+=cs;
  if(!allIn)notes.push(`메탄올 ${Math.round(c.phi*100)} %에서는 일부 성분이 15분 안에 나오지 않아요. 메탄올 비율을 높여 보세요.`);else if(minRs<1.5)notes.push(`메탄올 ${Math.round(c.phi*100)} %에서는 피크가 서로 겹쳐요(분리도 ${minRs.toFixed(1)}). 메탄올 비율을 낮춰 보세요.`);
  sec.push(['이동상 준비',mp,15]);
  // 장치 설정
  const wls={273:5,254:3,210:2,350:0}[c.wl];if(c.wl!==273)notes.push(`검출 파장 ${c.wl} nm — 카페인의 최대 흡수 파장(약 273 nm)에서 측정해야 감도가 가장 좋아요.`);
  const fs=c.flow>=.8&&c.flow<=1.5?5:c.flow>=.5&&c.flow<=2?3:1;if(fs<5)notes.push(`유속 ${c.flow.toFixed(1)} mL/min — 너무 느리면 분석이 길어지고, 너무 빠르면 압력이 높아지고 분리가 나빠져요.`);
  const eq=LCS.firstEquil?5:0;if(!eq)notes.push('평형화 없이 첫 시료를 주입해 기준선이 흔들렸어요. 압력·기준선이 안정된 뒤 주입하세요.');
  sec.push(['장치 설정',wls+fs+eq,15]);
  // 표준 측정
  const cal=new Set(LCS.runs.filter(r=>r.cal).map(r=>r.cal)).size;const ids=['asp','ben','sor'].filter(v=>LCS.runs.some(r=>r.vial===v)).length;
  const st=(cal>=4?5:cal>=3?3:0)+(LCS.runs.some(r=>r.vial==='blank')?2:0)+ids;if(ids<3)notes.push('첨가물 표준 용액을 모두 측정해야 시료의 피크를 확실히 판별할 수 있어요.');if(!LCS.runs.some(r=>r.vial==='blank'))notes.push('블랭크(이동상)를 측정해 용매에서 나오는 피크가 없는지 확인하세요.');
  sec.push(['표준 용액 측정',st,10]);
  // 전처리
  const cd=LCS.drink.caf/smp.dil;const inRange=cd>=10&&cd<=80;const pp=(LCS.prep.filter?5:0)+(inRange?5:0);
  if(!LCS.prep.filter)notes.push('시료를 거르지 않아 컬럼 압력이 올라갔어요. 시린지 필터로 거른 뒤 주입하세요.');
  if(!inRange)notes.push(`희석 시료 농도(${cd.toFixed(1)} mg/L)가 검량선 범위(10~80 mg/L)를 벗어났어요. 희석 배수를 다시 생각해 보세요.`);
  sec.push(['시료 전처리',pp,10]);
  // 결과 분석
  const opt=['caf','asp','ben','sor','ghost'];let idc=0;smp.table.forEach((p,i)=>{const truth=p.c.length>1?p.c.slice().sort((a,b)=>0)[0]:p.c[0];const pick=opt[+A.ids[i]];if(p.c.includes(pick)||(truth==='ghost'&&pick==='ghost'))idc++});
  const idS=r1(10*idc/Math.max(1,smp.table.length));if(idS<10)notes.push('성분 판별이 틀린 피크가 있어요. 표준 용액의 머무름 시간과 비교해 보세요.');

  const own=(num(A.area)-LCS.fit.b)/LCS.fit.a;const cdOK=Math.abs(num(A.cdil)-own)<=Math.abs(own)*.02+.05;const coOK=Math.abs(num(A.corig)-num(A.cdil)*smp.dil)<=Math.abs(num(A.cdil)*smp.dil)*.01+.1;
  const err=Math.abs(num(A.corig)-LCS.drink.caf)/LCS.drink.caf;const accS=err<=.05?5:err<=.1?3:0;
  const Rtrue=cafP?smp.tm/cafP.tr:0;const rOK=cafP&&Math.abs(num(A.R)-Rtrue)<=.011;
  if(!areaOK)notes.push('카페인 피크의 면적을 정확히 옮기지 않았어요. 카페인의 머무름 시간에 나온 피크를 찾으세요.');
  if(!cdOK)notes.push('검량선 식으로 희석 시료 농도를 다시 계산해 보세요: x = (y − b) ÷ a');
  if(!coOK)notes.push('원래 음료 농도 = 희석 시료 농도 × 희석 배수');
  if(accS<5)notes.push(`실제 카페인 농도와 ${(err*100).toFixed(1)} % 차이가 나요.`);
  if(!rOK)notes.push('머무름 비 R = tM ÷ tR (카페인의 tR 사용)');
  const an=r1(idS+(areaOK?5:0)+(cdOK?10:0)+(coOK?5:0)+accS+(rOK?5:0));sec.push(['결과 분석',an,40]);
  const eqm=LCS.overp?0:5;if(LCS.overp)notes.push(`압력 한계 초과 ${LCS.overp}회 — 컬럼과 펌프가 손상될 수 있어요.`);sec.push(['장비 관리',eqm,5]);
  const total=r1(sec.reduce((s,x)=>s+x[1],0));
  LCS.result={sec,total,notes,smp,truth:{caf:LCS.drink.caf,cafP,Rtrue}};
  record('LC/가상 실험',`카페인 · ${c.wl} nm · ${smp.dil}배`,total,igText(LCS.ig)+sec.map(s=>`${s[0]} ${s[1]}/${s[2]}`).join(' · ')+` · 실제 ${LCS.drink.caf} mg/L · 답 ${A.corig}`,r1(total*.6));
  if(IG.on&&IG.ctx===LABCTX_LC)igStop();
}

function gcSchematic(withNums){
  const B=[[14,30],[174,30],[334,30],[334,150],[174,150],[14,150]];
  let s=`<svg viewBox="0 0 440 240" role="img" aria-label="GC 구조도"><defs><marker id="ahg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="var(--glass)"/></marker></defs>`;
  for(let i=0;i<B.length-1;i++){const [x1,y1]=B[i],[x2,y2]=B[i+1];
    if(y1===y2){const a=x2>x1;s+=`<path d="M${a?x1+92:x1} ${y1+35} H${a?x2:x2+92}" stroke="var(--glass)" stroke-width="3" marker-end="url(#ahg)"/>`}
    else s+=`<path d="M${x1+46} ${y1+70} V${y2}" stroke="var(--glass)" stroke-width="3" marker-end="url(#ahg)"/>`}
  B.forEach(([x,y],i)=>{s+=`<rect x="${x}" y="${y}" width="92" height="70" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><g transform="translate(${x+21},${y+2}) scale(.72)" style="color:var(--ink)">${ICON[GCPARTS[i][0]]}</g>`;
    if(withNums)s+=`<circle cx="${x+10}" cy="${y+10}" r="11" fill="var(--accent)"/><text x="${x+10}" y="${y+14.5}" font-size="13" text-anchor="middle" fill="#fff" font-family="IBM Plex Mono" font-weight="700">${i+1}</text>`});
  return s+'</svg>';
}
let LBG=null;
function paneLabelGc(el){
  if(!LBG||LBG.doneFlag)LBG={slots:Array(GCPARTS.length).fill(null),pick:null,tries:0,doneFlag:false};
  const chips=shuffle(GCPARTS.map((l,i)=>i));
  el.innerHTML=`<div class="bench wide"><div class="scene" style="align-items:center">${gcSchematic(true).replace('<svg ','<svg style="max-width:520px" ')}</div>
   <div><p class="small muted">이름 카드를 누른 뒤 번호 칸을 누르세요. 화살표가 운반 기체가 흐르는 방향이에요.</p>
   <div class="row" style="gap:8px;margin-top:10px">${chips.map(i=>`<button class="chip ${LBG.slots.includes(i)?'used':''}" data-c="${i}" style="${LBG.pick===i?'border-color:var(--accent);background:var(--accent-soft)':''}">${GCPARTS[i][1]}</button>`).join('')}</div>
   <div class="stack" style="gap:8px;margin-top:14px">${GCPARTS.map((l,k)=>`<div class="row" style="gap:8px"><span class="pill acc mono">${k+1}</span><button class="slot ${LBG.slots[k]!=null?'fill':''}" data-s="${k}" style="flex:1">${LBG.slots[k]!=null?GCPARTS[LBG.slots[k]][1]:'?'}</button></div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn pri" id="lchk">확인</button><button class="btn sm" id="lreset">다시 하기</button></div><div id="lfb" style="margin-top:10px"></div></div></div>`;
  $$('[data-c]',el).forEach(b=>b.onclick=()=>{LBG.pick=+b.dataset.c;paneLabelGc(el)});
  $$('[data-s]',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.s;if(LBG.slots[k]!=null)LBG.slots[k]=null;else if(LBG.pick!=null){LBG.slots[k]=LBG.pick;LBG.pick=null}paneLabelGc(el)});
  $('#lreset').onclick=()=>{LBG=null;paneLabelGc(el)};
  $('#lchk').onclick=()=>{if(LBG.slots.includes(null)){toast('빈칸을 모두 채우세요');return}LBG.tries++;
    const wrong=LBG.slots.map((v,k)=>v===k?null:k).filter(v=>v!=null);
    if(!wrong.length){LBG.doneFlag=true;$('#lfb').innerHTML='<div class="note ok">모두 맞았어요! 운반 기체가 이동상, 분리관 속 물질이 고정상입니다.</div>';missionComplete('장치 이름',`시도 ${LBG.tries}회`)}

function computeScores(list,ex=XK()){
  const th={기초:0,심화:0};
  list.filter(r=>r.kind===`${ex}/기초 이론`).forEach(r=>{const lv=String(r.item).slice(0,2);if(lv in th)th[lv]=Math.max(th[lv],+r.pa||0)});
  const theory=Math.min(20,r1(th.기초+th.심화));
  const mset=(MISSIONSETS[(EXPS.find(e=>e.k===ex)||EXPS[0]).id]).map(m=>m[1]);const got=new Set(list.filter(r=>r.kind===`${ex}/실험 장치`).map(r=>String(r.item)));
  const missT=mset.length,miss=mset.filter(n=>got.has(n)).length;const prac=r1(20*miss/missT);
  const exl=list.filter(r=>r.kind===`${ex}/가상 실험`);const exA=exl.length?Math.min(60,Math.max(...exl.map(r=>+r.pa||0))):0;
  return {th,theory,miss,missT,prac,exA,exN:exl.length,total:r1(theory+prac+exA)};
}

  const by={};rows.forEach(r=>{const k=`${r.grade}|${r.cls}|${r.no}|${r.name}`;(by[k]=by[k]||{r,list:[]}).list.push(r)});
  const tm=x=>new Date(x.time||x.clientTime);
  const sum=Object.entries(by).map(([k,{r,list}])=>({k,grade:r.grade,cls:r.cls,no:r.no,name:r.name,sc:computeScores(list,TDK()),n:list.length,away:list.filter(x=>x.kind==='화면 이탈').length,awayS:list.filter(x=>x.kind==='화면 이탈').reduce((a,x)=>a+(+(String(x.detail).match(/(\d+)초/)||[0,0])[1]),0),last:list.map(tm).sort((a,b)=>b-a)[0]})).sort((a,b)=>a.grade-b.grade||a.cls-b.cls||a.no-b.no||String(a.name).localeCompare(b.name));
  const avg=sum.length?r1(sum.reduce((s,x)=>s+x.sc.total,0)/sum.length):0;
  const detail=rows.slice().sort((a,b)=>tm(b)-tm(a));
  const dt=d=>new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">교사용 · ${SHEET_URL?'Google 스프레드시트 연결됨':'이 기기에 저장된 기록'}</p><h2 style="margin-top:6px">수행평가 결과 · 크로마토그래피</h2></div>
   <div class="row"><button class="btn sm" id="trf">새로고침</button><button class="btn sm" id="tpw">비밀번호 변경</button><button class="btn sm" id="tall" style="border-color:var(--bad);color:var(--bad)">전체 초기화</button></div></div>
   ${SHEET_URL?'':'<div class="note warn" style="margin-top:12px">스프레드시트가 연결되지 않아 이 컴퓨터(브라우저)에서 활동한 학생 기록만 보여요. 모든 학생 기록을 모으려면 README대로 Apps Script를 연결하세요.</div>'}
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px">
    <div class="panel"><div class="small muted">학생 수</div><div class="mono" style="font-size:26px;font-weight:600">${sum.length}</div></div>
    <div class="panel"><div class="small muted">${TDE().short} 평균 총점</div><div class="mono" style="font-size:26px;font-weight:600">${avg}<span class="small muted"> / 100</span></div></div>
    <div class="panel"><div class="small muted">기록 수</div><div class="mono" style="font-size:26px;font-weight:600">${rows.length}</div></div>
    <div class="panel"><div class="small muted">가상 실험 응시 학생</div><div class="mono" style="font-size:26px;font-weight:600">${sum.filter(s=>s.sc.exN).length}</div></div></div>
   <div class="panel row" style="margin-top:14px">
    <label class="row small" style="gap:6px">학년 <select id="fg"><option value="">전체</option>${grades.map(g=>`<option ${f.g===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px">반 <select id="fc"><option value="">전체</option>${classes.map(c=>`<option ${f.c===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="row small" style="gap:6px;flex:1;min-width:180px">이름 <input id="fq" value="${esc(f.q)}" placeholder="이름으로 찾기" style="flex:1"></label></div>
   <div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3>학생별 수행평가 · ${TDE().name}</h3>
    <div class="row" style="gap:6px">${EXPS.filter(e=>e.ready).map(e=>`<button class="btn sm ${TD.ex===e.id?'pri':''}" data-tex="${e.id}">${e.short}</button>`).join('')}</div></div>
    <p class="small muted" style="margin-top:4px">${SCORE_RULES.map(r=>`${r[0]} ${r[1]}`).join(' · ')} = 실험마다 100점. 가상 실험은 가장 높은 회차 기준.</p>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>기초 이론<br><span class="small muted">20</span></th><th>실험 장치<br><span class="small muted">20</span></th><th>가상 실험<br><span class="small muted">60</span></th><th>총점<br><span class="small muted">100</span></th><th>세부</th><th>화면 이탈</th><th>마지막 활동</th><th>초기화</th></tr>
    ${sum.map((s,i)=>`<tr><td>${s.grade}</td><td>${s.cls}</td><td>${s.no}</td><td style="font-weight:600">${esc(s.name)}</td><td class="mono">${s.sc.theory}</td><td class="mono">${s.sc.prac}</td><td class="mono">${s.sc.exA}</td><td class="mono" style="font-weight:700;color:var(--accent)">${s.sc.total}</td>
      <td class="small" style="text-align:left">이론 기초${s.sc.th.기초}·심화${s.sc.th.심화} · 미션 ${s.sc.miss}/${s.sc.missT} · 실험 ${s.sc.exN}회</td><td>${s.away?`<span class="igpill">${s.away}회·${s.awayS}초</span>`:'<span class="muted">—</span>'}</td><td class="mono small">${s.last?dt(s.last):''}</td><td><button class="btn sm" data-rs="${i}">초기화</button></td></tr>`).join('')||'<tr><td colspan="12" class="muted">조건에 맞는 기록이 없어요</td></tr>'}</table></div></div>
   <div class="card" style="margin-top:14px"><h3>전체 기록 (최신순)</h3>
    <div class="tw" style="margin-top:10px"><table class="table"><tr><th>시간</th><th>학번</th><th>이름</th><th>구분</th><th>항목</th><th>점수</th><th>수행 반영</th><th style="text-align:left">상세</th></tr>
    ${detail.slice(0,TD.show).map(r=>`<tr><td class="mono small">${dt(r.time||r.clientTime)}</td><td class="mono">${r.grade}-${r.cls}-${r.no}</td><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(r.item)}</td><td class="mono">${r.score}</td><td class="mono small">${/가상 실험$/.test(r.kind)?`${r.pa} / 60`:/기초 이론$/.test(r.kind)?`${r.pa}점`:r.kind==='화면 이탈'?'<span class="igpill">이탈</span>':'미션 1'}</td><td class="small" style="text-align:left">${esc(r.detail)}</td></tr>`).join('')}</table></div>
    ${detail.length>TD.show?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="tmore">더 보기 (${detail.length-TD.show}건 남음)</button></div>`:''}
    ${SHEET_URL?'<p class="small muted" style="margin-top:8px">원본 데이터는 Google 스프레드시트 「결과」 시트에 있습니다. 초기화한 기록은 「삭제된 기록」 시트로 옮겨져 필요하면 되살릴 수 있어요.</p>':''}</div>`;
  $('#fg').onchange=e=>{f.g=e.target.value;drawTeacher()};$('#fc').onchange=e=>{f.c=e.target.value;drawTeacher()};
  $('#fq').oninput=e=>{f.q=e.target.value.trim();clearTimeout(TD.qt);TD.qt=setTimeout(()=>{drawTeacher();const q=$('#fq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  $('#trf').onclick=()=>{toast('새로 불러오는 중…');reloadTeacher()};
  const mo=$('#tmore');if(mo)mo.onclick=()=>{TD.show+=100;drawTeacher()};
  $$('[data-rs]').forEach(b=>b.onclick=()=>{const s=sum[+b.dataset.rs];confirmReset(`${s.grade}학년 ${s.cls}반 ${s.no}번 ${s.name}`,`이 학생의 기록 ${s.n}건을 모두 지웁니다.`,{scope:'one',grade:String(s.grade),cls:String(s.cls),no:String(s.no),name:String(s.name)})});
  $('#tall').onclick=()=>confirmReset('전체 학생',`모든 학생의 기록 ${all.length}건을 지웁니다. 새 학기·새 반 수업 전에 사용하세요.`,{scope:'all'},true);
  $('#tpw').onclick=changeKey;
  $$('[data-tex]').forEach(b=>b.onclick=()=>{TD.ex=b.dataset.tex;drawTeacher()});
}
function confirmReset(who,msg,params,strong){
  modal(`<h3 style="color:var(--bad)">${esc(who)} 결과 초기화</h3><p style="margin-top:8px">${esc(msg)}</p>
   ${strong?'<label class="stack" style="gap:4px;margin-top:10px"><span class="small">확인을 위해 <b>초기화</b>라고 입력하세요</span><input id="cf" autocomplete="off"></label>':''}
   <p class="small muted" style="margin-top:8px">${SHEET_URL?'지운 기록은 스프레드시트 「삭제된 기록」 시트에 보관됩니다.':'이 기기에서 지운 기록은 되살릴 수 없어요.'}</p>
   <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>취소</button><button class="btn" id="cfok" style="background:var(--bad);border-color:var(--bad);color:#fff">초기화</button></div>`,(m,close)=>{
    $('#cfok',m).onclick=async()=>{if(strong&&$('#cf',m).value.trim()!=='초기화'){toast('"초기화"라고 입력하세요');return}
      try{const j=await API.call({action:'reset',key:TD.key,...params});if(!j.ok){toast(j.error||'초기화 실패');return}close();toast(`${who} 기록 ${j.removed??''}건을 초기화했어요`);reloadTeacher()}
      catch(e){toast('초기화하지 못했어요. 인터넷 연결을 확인하세요.')}};
  });
}
function changeKey(){
  modal(`<h3>교사 비밀번호 변경</h3><form id="kf" class="stack" style="margin-top:12px;gap:10px">
   <label class="stack" style="gap:4px"><span class="small">새 비밀번호 (4자 이상)</span><input id="k1" type="password" autocomplete="new-password"></label>
   <label class="stack" style="gap:4px"><span class="small">새 비밀번호 확인</span><input id="k2" type="password" autocomplete="new-password"></label>
   <p class="small muted">${SHEET_URL?'스프레드시트에 저장되어 모든 기기에 바로 적용돼요.':'이 기기(브라우저)에만 적용돼요.'}</p>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>취소</button><button class="btn pri" type="submit">변경</button></div></form>`,(m,close)=>{
    bindForm($('#kf',m),async e=>{const a=$('#k1',m).value,b=$('#k2',m).value;
      if(a.length<4){toast('4자 이상 입력하세요');return}if(a!==b){toast('두 비밀번호가 달라요');return}
      try{const j=await API.call({action:'setkey',key:TD.key,newkey:a});if(!j.ok){toast(j.error||'변경 실패');return}TD.key=a;close();toast('비밀번호를 바꿨어요')}
      catch(err){toast('변경하지 못했어요. 인터넷 연결을 확인하세요.')}});
  });
}
function openGate(){
  const g=$('#gate');if(!g||g.dataset.busy)return;g.dataset.busy=1;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  g.classList.add('open');setTimeout(()=>g.classList.add('gone'),reduce?50:700);setTimeout(()=>{g.remove();document.body.style.overflow=''},reduce?400:1400);
}
(function(){const g=$('#gate');if(!g)return;document.body.style.overflow='hidden';$('#gopen').onclick=openGate;$('#gframe').onclick=openGate;setTimeout(()=>$('#gopen').focus(),50)})();
render();flushOutbox();
</script>
</body>
</html>
